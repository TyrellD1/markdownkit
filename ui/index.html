<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarkdownKit</title>
    <script>
      try {
        const theme = localStorage.getItem("markdownkit.theme") || "system";
        document.documentElement.dataset.theme = theme;
      } catch {
        /* ignore */
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="chrome" data-tauri-drag-region>
      <nav class="nav" id="nav" aria-label="History">
        <button type="button" id="back" aria-label="Back" disabled>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M7.5 2.5 3.5 6l4 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" id="forward" aria-label="Forward" disabled>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M4.5 2.5 8.5 6l-4 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </nav>
    </header>

    <main id="app">
      <section class="empty" id="empty">
        <div class="mark" aria-hidden="true">
          <svg width="64" height="72" viewBox="0 0 64 72" fill="none">
            <rect x="8" y="4" width="48" height="64" rx="6" fill="#fff" stroke="#e3e2de" />
            <path d="M14 0v18h10L19 9 14 0z" fill="#37352f" />
            <text x="32" y="46" text-anchor="middle" font-size="16" font-family="ui-sans-serif, system-ui" fill="#37352f">md</text>
          </svg>
        </div>
        <h1>markdownkit</h1>
        <p class="lede">A calm reader for local markdown.</p>
        <button type="button" id="open-button">Open a file</button>
        <p class="hint">Drop a <code>.md</code> file here, or press <kbd>⌘O</kbd></p>
      </section>

      <article class="page" id="page" hidden>
        <dl class="props" id="props" hidden></dl>
        <div class="content" id="content"></div>
      </article>
    </main>

    <div class="modal" id="settings" hidden>
      <div class="modal-card" role="dialog" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>

        <div class="setting">
          <p class="setting-label">Appearance</p>
          <div class="seg" role="radiogroup" aria-label="Appearance">
            <button type="button" data-theme="system">System</button>
            <button type="button" data-theme="light">Light</button>
            <button type="button" data-theme="dark">Dark</button>
          </div>
        </div>

        <label class="setting toggle">
          <input type="checkbox" id="show-frontmatter" />
          <span>Show front matter</span>
        </label>

        <label class="setting toggle">
          <input type="checkbox" id="live-reload" />
          <span>Reload when the file changes on disk</span>
        </label>

        <button type="button" class="done" id="settings-done">Done</button>
      </div>
    </div>

    <p class="toast" id="toast" hidden></p>
    <script src="./mermaid.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
