[package]
name = "markdownkit"
version = "0.2.0"
description = "A beautiful, hardware-efficient macOS markdown viewer"
authors = ["Tyrell"]
edition = "2021"
license = "MIT"

[lib]
name = "markdownkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markdownkit-engine = { path = "../crates/engine" }
notify = "8"
