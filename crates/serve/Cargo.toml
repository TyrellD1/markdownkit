[package]
name = "markdownkit-serve"
version = "0.2.0"
description = "Serve local markdown as MarkdownKit HTML"
edition = "2021"
license = "MIT"

[[bin]]
name = "markdownkit-serve"
path = "src/main.rs"

[dependencies]
markdownkit-engine = { path = "../engine" }
markdownkit-update = { path = "../update" }
tiny_http = "0.12"
urlencoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
